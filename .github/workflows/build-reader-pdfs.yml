name: Build bilingual reader PDFs
on:
  push:
    branches: [main]
    paths:
      - "article-fr.html"
      - "article-en.html"
      - "articles.css"
      - "preuves-fr.html"
      - "proofs-en.html"
      - ".github/workflows/build-reader-pdfs.yml"
  workflow_dispatch:

concurrency:
  group: bilingual-reader-pdf-generation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: python -m pip install --disable-pip-version-check weasyprint
      - name: Render HTML articles as PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from weasyprint import HTML
          for name in ("article-fr", "article-en", "preuves-fr", "proofs-en"):
              src = Path(f"{name}.html").resolve()
              dst = Path(f"{name}.pdf")
              HTML(filename=str(src), base_url=str(src.parent)).write_pdf(str(dst))
              if dst.stat().st_size < 15000:
                  raise RuntimeError(f"Suspiciously small PDF: {dst}")
              print(f"{dst}: {dst.stat().st_size} bytes")
          PY
      - name: Publish generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-fr.pdf article-en.pdf preuves-fr.pdf proofs-en.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Generate bilingual reader PDFs"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo "Failed to publish generated PDFs after retries" >&2
            exit 1
          fi
